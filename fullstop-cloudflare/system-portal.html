<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FULL STOP | System Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rubik:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #F8FAFC; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Inter', sans-serif; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo-circle { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #FCD34D; margin-bottom: 20px; }
        h1 { font-family: 'Rubik', sans-serif; color: #1E293B; margin-bottom: 10px; }
        p { color: #64748B; font-size: 0.9rem; margin-bottom: 30px; }
        .input-box { position: relative; margin-bottom: 20px; text-align: left; }
        
        /* Icon sa kaliwa (User/Lock) */
        .input-box .left-icon { position: absolute; left: 15px; top: 38px; color: #94A3B8; }
        
        /* Icon sa kanan (Eye Icon) */
        .input-box .eye-icon { position: absolute; right: 15px; top: 38px; color: #94A3B8; cursor: pointer; transition: color 0.3s; }
        .input-box .eye-icon:hover { color: #1E293B; }

        .input-box label { font-size: 0.8rem; font-weight: 600; color: #475569; display: block; margin-bottom: 8px; }
        .input-box input { width: 100%; padding: 12px 45px 12px 45px; border: 1.5px solid #E2E8F0; border-radius: 10px; outline: none; transition: 0.3s; box-sizing: border-box;}
        .input-box input:focus { border-color: #D31225; box-shadow: 0 0 0 4px rgba(211, 18, 37, 0.1); }
        .btn-login { width: 100%; background: #1E293B; color: white; padding: 14px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-login:hover { background: #D31225; transform: translateY(-2px); }
        .back-home { display: block; margin-top: 20px; color: #94A3B8; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="assets/FULL STOP.jpg" alt="Logo" class="logo-circle">
        <h1>System Portal</h1>
        <p>Enter your credentials to access the management system.</p>

        <form id="loginForm">
            <div class="input-box">
                <label>Login ID</label>
                <i class="fa-solid fa-user left-icon"></i>
                <input type="text" id="username" placeholder="Enter ID (e.g. FS-ADMIN)" required>
            </div>
            <div class="input-box">
                <label>Access PIN / Password</label>
                <i class="fa-solid fa-lock left-icon"></i>
                <input type="password" id="password" placeholder="••••••" required>
                <i class="fa-solid fa-eye eye-icon" id="togglePassword" title="Show/Hide Password"></i>
            </div>
            <button type="submit" class="btn-login">Secure Login</button>
        </form>

        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Public Site</a>
    </div>

    <!-- api.js must be loaded before login logic -->
    <script src="js/api.js?v=2"></script>
    <script>
        // ---- Eye icon toggle ----
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput  = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // ---- Login form — calls PHP backend ----
        document.getElementById('loginForm').onsubmit = async function(e) {
            e.preventDefault();

            const loginId  = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn      = document.querySelector('.btn-login');

            if (!loginId || !password) {
                alert('Please enter your Login ID and Password.');
                return;
            }

            // Show loading state
            btn.textContent = 'Logging in...';
            btn.disabled    = true;

            const result = await API.login(loginId, password);

            if (result && result.success) {
                const user = result.data;
                // Store minimal info in sessionStorage for UI personalisation
                sessionStorage.setItem('fs_user', JSON.stringify(user));

                if (user.role === 'admin') {
                    window.location.replace('admin.html');
                } else {
                    window.location.replace('branch.html');
                }
            } else {
                alert(result?.message || 'Invalid Login ID or Password. Please try again.');
                btn.textContent = 'Secure Login';
                btn.disabled    = false;
            }
        };

        // If already logged in, redirect immediately
        (async () => {
            const result = await API.session();
            if (result && result.success) {
                const role = result.data.role;
                window.location.replace(role === 'admin' ? 'admin.html' : 'branch.html');
            }
        })();
    </script>
</body>
</html>
